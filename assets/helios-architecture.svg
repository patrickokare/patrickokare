<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 780" width="1700" height="780" role="img" aria-labelledby="t d"><title id="t">Helios Trading Lakehouse solution architecture</title><desc id="d">Ten daily feeds from six depots land in a landing zone, flow through Bronze, Silver and Gold layers on Databricks with Unity Catalog, and serve Metric Views, Genie and a Lakebase operations app.</desc><style>text{font-family:Inter,Helvetica,Arial,sans-serif}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker><linearGradient id="bz" x1="0" x2="1"><stop offset="0" stop-color="#F59E0B"/><stop offset="1" stop-color="#FDBA74"/></linearGradient><linearGradient id="sv" x1="0" x2="1"><stop offset="0" stop-color="#CBD5E1"/><stop offset="1" stop-color="#F1F5F9"/></linearGradient><linearGradient id="gd" x1="0" x2="1"><stop offset="0" stop-color="#16A34A"/><stop offset="1" stop-color="#86EFAC"/></linearGradient></defs><rect width="1700" height="780" rx="18" fill="#F8FAFC"/><rect x="1" y="1" width="1698" height="778" rx="18" fill="none" stroke="#E2E8F0" stroke-width="2"/><text x="48" y="64" font-size="30" font-weight="700" fill="#0F172A">Solution architecture: Helios Trading Lakehouse</text><text x="48" y="96" font-size="17" fill="#475569">Ten daily feeds from six depots through a medallion lakehouse on Unity Catalog</text><line x1="48" y1="122" x2="1652" y2="122" stroke="#E2E8F0" stroke-width="2"/><text x="130" y="160" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="2" fill="#64748B">SOURCES</text><text x="370" y="160" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="2" fill="#64748B">LANDING</text><text x="640" y="160" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="2" fill="#64748B">INGEST</text><text x="920" y="160" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="2" fill="#64748B">REFINE</text><text x="1200" y="160" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="2" fill="#64748B">MODEL</text><text x="1530" y="160" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="2" fill="#64748B">SERVE</text><rect x="40" y="215" width="180" height="170" rx="14" fill="#FFFFFF" stroke="#334155" stroke-width="2.5"/><text x="130" y="258" text-anchor="middle" font-size="18" font-weight="700" fill="#0F172A">6 depots</text><text x="130" y="282" text-anchor="middle" font-size="14" fill="#475569">10 daily feeds</text><rect x="72" y="302" width="116" height="22" rx="11" fill="#0EA5E9" fill-opacity=".14" stroke="#0EA5E9"/><text x="130" y="318" text-anchor="middle" font-size="13" font-weight="600" fill="#0F172A">JSON</text><rect x="72" y="328" width="116" height="22" rx="11" fill="#8B5CF6" fill-opacity=".14" stroke="#8B5CF6"/><text x="130" y="344" text-anchor="middle" font-size="13" font-weight="600" fill="#0F172A">CSV</text><rect x="72" y="354" width="116" height="22" rx="11" fill="#F97316" fill-opacity=".14" stroke="#F97316"/><text x="130" y="370" text-anchor="middle" font-size="13" font-weight="600" fill="#0F172A">Parquet</text><line x1="220" y1="300" x2="290" y2="300" stroke="#475569" stroke-width="2.5" marker-end="url(#ah)"/><rect x="226.5" y="242" width="57" height="46" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="255" y="264" text-anchor="middle" font-size="13" font-weight="600" fill="#334155">Daily</text><text x="255" y="281" text-anchor="middle" font-size="13" font-weight="600" fill="#334155">files</text><path d="M290 232h62l18 22h80a10 10 0 0 1 10 10v108a10 10 0 0 1-10 10H300a10 10 0 0 1-10-10V242a10 10 0 0 1 10-10z" fill="#E0F2FE" stroke="#334155" stroke-width="2.5"/><text x="370" y="316" text-anchor="middle" font-size="18" font-weight="700" fill="#0F172A">Landing zone</text><text x="370" y="341" text-anchor="middle" font-size="14" fill="#475569">Files as delivered</text><line x1="450" y1="300" x2="565" y2="300" stroke="#475569" stroke-width="2.5" marker-end="url(#ah)"/><rect x="474.8" y="242" width="64.4" height="46" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="507" y="264" text-anchor="middle" font-size="13" font-weight="600" fill="#334155">Auto</text><text x="507" y="281" text-anchor="middle" font-size="13" font-weight="600" fill="#334155">Loader</text><path d="M565 257 v86 a75 22 0 0 0 150 0 v-86" fill="url(#bz)" stroke="#334155" stroke-width="2.5"/><ellipse cx="640" cy="257" rx="75" ry="22" fill="url(#bz)" stroke="#334155" stroke-width="2.5"/><text x="640" y="314" text-anchor="middle" font-size="22" font-weight="800" letter-spacing="2" fill="#431407">BRONZE</text><line x1="715" y1="300" x2="845" y2="300" stroke="#475569" stroke-width="2.5" marker-end="url(#ah)"/><rect x="725.6" y="242" width="108.8" height="46" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="780" y="264" text-anchor="middle" font-size="13" font-weight="600" fill="#334155">foreachBatch</text><text x="780" y="281" text-anchor="middle" font-size="13" font-weight="600" fill="#334155">MERGE</text><path d="M845 257 v86 a75 22 0 0 0 150 0 v-86" fill="url(#sv)" stroke="#334155" stroke-width="2.5"/><ellipse cx="920" cy="257" rx="75" ry="22" fill="url(#sv)" stroke="#334155" stroke-width="2.5"/><text x="920" y="314" text-anchor="middle" font-size="22" font-weight="800" letter-spacing="2" fill="#0F172A">SILVER</text><line x1="995" y1="300" x2="1125" y2="300" stroke="#475569" stroke-width="2.5" marker-end="url(#ah)"/><rect x="1001.9" y="242" width="116.2" height="46" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="1060" y="264" text-anchor="middle" font-size="13" font-weight="600" fill="#334155">Point-in-time</text><text x="1060" y="281" text-anchor="middle" font-size="13" font-weight="600" fill="#334155">pricing</text><path d="M1125 257 v86 a75 22 0 0 0 150 0 v-86" fill="url(#gd)" stroke="#334155" stroke-width="2.5"/><ellipse cx="1200" cy="257" rx="75" ry="22" fill="url(#gd)" stroke="#334155" stroke-width="2.5"/><text x="1200" y="314" text-anchor="middle" font-size="22" font-weight="800" letter-spacing="2" fill="#052E16">GOLD</text><rect x="530" y="415" width="220" height="96" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/><rect x="530" y="415" width="6" height="96" rx="3" fill="#F59E0B"/><text x="552" y="443" font-size="15" font-weight="700" fill="#0F172A">Bronze layer</text><text x="552" y="469" font-size="14" fill="#475569">Raw, append-only</text><text x="552" y="493" font-size="14" fill="#475569">Delta tables</text><rect x="770" y="415" width="300" height="120" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/><rect x="770" y="415" width="6" height="120" rx="3" fill="#94A3B8"/><text x="792" y="443" font-size="15" font-weight="700" fill="#0F172A">Silver layer</text><text x="792" y="469" font-size="14" fill="#475569">Typed and conformed</text><text x="792" y="493" font-size="14" fill="#475569">Deduplicated, CDC, SCD Type 2</text><text x="792" y="517" font-size="14" fill="#475569">Bad rows quarantined, never dropped</text><rect x="1085" y="415" width="230" height="120" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/><rect x="1085" y="415" width="6" height="120" rx="3" fill="#16A34A"/><text x="1107" y="443" font-size="15" font-weight="700" fill="#0F172A">Gold layer</text><text x="1107" y="469" font-size="14" fill="#475569">Kimball star schema</text><text x="1107" y="493" font-size="14" fill="#475569">Facts and dimensions</text><text x="1107" y="517" font-size="14" fill="#475569">Point-in-time pricing</text><rect x="1410" y="215" width="240" height="72" rx="12" fill="#FFFFFF" stroke="#334155" stroke-width="2"/><rect x="1410" y="215" width="8" height="72" rx="4" fill="#0EA5E9"/><text x="1436" y="245" font-size="17" font-weight="700" fill="#0F172A">Metric Views</text><text x="1436" y="269" font-size="14" fill="#475569">KPIs and dashboards</text><path d="M1275 300 C 1340 300, 1350 251, 1408 251" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#ah)"/><rect x="1410" y="305" width="240" height="72" rx="12" fill="#FFFFFF" stroke="#334155" stroke-width="2"/><rect x="1410" y="305" width="8" height="72" rx="4" fill="#8B5CF6"/><text x="1436" y="335" font-size="17" font-weight="700" fill="#0F172A">Genie</text><text x="1436" y="359" font-size="14" fill="#475569">Natural-language analytics</text><path d="M1275 300 C 1340 300, 1350 341, 1408 341" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#ah)"/><rect x="1410" y="395" width="240" height="72" rx="12" fill="#FFFFFF" stroke="#334155" stroke-width="2"/><rect x="1410" y="395" width="8" height="72" rx="4" fill="#F97316"/><text x="1436" y="425" font-size="17" font-weight="700" fill="#0F172A">Lakebase</text><text x="1436" y="449" font-size="14" fill="#475569">Operations app</text><path d="M1275 300 C 1340 300, 1350 431, 1408 431" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#ah)"/><rect x="40" y="580" width="1620" height="170" rx="16" fill="#0F172A"/><text x="72" y="622" font-size="13" font-weight="700" letter-spacing="2" fill="#6EE7B7">PLATFORM AND GOVERNANCE</text><rect x="72" y="644" width="500" height="80" rx="12" fill="#FFFFFF" fill-opacity=".06" stroke="#FFFFFF" stroke-opacity=".15"/><text x="94" y="676" font-size="18" font-weight="700" fill="#F8FAFC">Unity Catalog</text><text x="94" y="704" font-size="14" fill="#CBD5E1">Governed access and lineage across every layer</text><rect x="604" y="644" width="500" height="80" rx="12" fill="#FFFFFF" fill-opacity=".06" stroke="#FFFFFF" stroke-opacity=".15"/><text x="626" y="676" font-size="18" font-weight="700" fill="#F8FAFC">Delta Lake</text><text x="626" y="704" font-size="14" fill="#CBD5E1">ACID tables, with MERGE for CDC and SCD Type 2</text><rect x="1136" y="644" width="500" height="80" rx="12" fill="#FFFFFF" fill-opacity=".06" stroke="#FFFFFF" stroke-opacity=".15"/><text x="1158" y="676" font-size="18" font-weight="700" fill="#F8FAFC">Databricks</text><text x="1158" y="704" font-size="14" fill="#CBD5E1">Auto Loader and Structured Streaming</text></svg>
